name: "Papr Cloud Release Build"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version Tag (e.g. 0.5.2)"
        required: true
        type: string
        default: "0.5.2"
      custom_notes:
        description: "Custom Release Highlights / Notes (Optional)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
  _JAVA_OPTIONS: "-Xmx6144m"

jobs:
  build-apk:
    name: "Build ${{ matrix.abi }} APK"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: "arm64-v8a"
            name: "arm64-v8a"
            flags: "-PreactNativeArchitectures=arm64-v8a"
          - abi: "armeabi-v7a"
            name: "armeabi-v7a"
            flags: "-PreactNativeArchitectures=armeabi-v7a"
          - abi: "x86_64"
            name: "x86_64"
            flags: "-PreactNativeArchitectures=x86_64"
          - abi: "universal"
            name: "universal"
            flags: "-PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64"

    steps:
      - name: "Checkout Private Source Repository (papr-core)"
        uses: actions/checkout@v4
        with:
          repository: "sarfarazstark/papr-core"
          ssh-key: ${{ secrets.PAPR_CORE_SSH_KEY }}
          fetch-depth: 0

      - name: "Setup Ccache for Native C/C++ Compilation"
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.abi }}-ccache-v1
          max-size: "2000M"
          create-symlink: true

      - name: "Setup Node.js 24 (LTS)"
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: "Setup Bun Toolchain"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: "Cache Bun Dependencies Store"
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: "Setup Java 17 (Temurin)"
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Setup Android NDK & SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: "Install Android NDK and CMake"
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: "Install Node Dependencies"
        run: |
          bun install --frozen-lockfile

      - name: "Synchronize Native Android Configuration via Expo Prebuild"
        run: |
          bunx expo prebuild --platform android --no-install

      - name: "Setup Gradle Build Cache"
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: "Compile ${{ matrix.abi }} Release APK"
        working-directory: android
        timeout-minutes: 45
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --build-cache --parallel ${{ matrix.flags }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -Dorg.gradle.jvmargs="-Xmx6144m -XX:MaxMetaspaceSize=1024m" -Pandroid.enableMinifyInReleaseBuilds=true -Pandroid.enableShrinkResourcesInReleaseBuilds=true

      - name: "Package APK Artifact"
        run: |
          mkdir -p staging
          VERSION_TAG="v${{ inputs.version }}"
          
          echo "=== All APK outputs ==="
          find android/app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "No APKs found in outputs"
          
          # Search broadly for any release APK
          APK_FILE=$(find android/app/build/outputs -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found anywhere in android/app/build/outputs"
            echo "=== Full outputs directory listing ==="
            find android/app/build/outputs -type f 2>/dev/null || echo "outputs directory does not exist"
            exit 1
          fi
          
          TARGET_NAME="papr-${VERSION_TAG}-${{ matrix.name }}.apk"
          cp "$APK_FILE" "staging/${TARGET_NAME}"
          echo "Staged staging/${TARGET_NAME} ($(du -h "staging/${TARGET_NAME}" | cut -f1))"

      - name: "Upload APK Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "papr-apk-${{ matrix.name }}"
          path: "staging/*.apk"
          retention-days: 5

  publish-release:
    name: "Publish GitHub Release"
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Private Source Repository for Git History"
        uses: actions/checkout@v4
        with:
          repository: "sarfarazstark/papr-core"
          ssh-key: ${{ secrets.PAPR_CORE_SSH_KEY }}
          fetch-depth: 0

      - name: "Download All Built APK Artifacts"
        uses: actions/download-artifact@v4
        with:
          path: dist/release-apks
          merge-multiple: true

      - name: "Generate SHA-256 Checksums"
        working-directory: dist/release-apks
        run: |
          ls -la
          sha256sum *.apk > checksums.txt
          cat checksums.txt

      - name: "Generate Release Notes"
        id: release_notes
        run: |
          VERSION="${{ inputs.version }}"
          CUSTOM_NOTES="${{ inputs.custom_notes }}"
          
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)")
          else
            COMMITS=$(git log -n 25 --pretty=format:"* %s (%h)")
          fi

          cat << 'EOF' > release_body.md
          ## 📦 Papr v${VERSION} Release

          A privacy-first, offline document utility toolkit for Android.

          ### 📱 Available APK Downloads
          * **`papr-v${VERSION}-arm64-v8a.apk`** — Recommended for all modern 64-bit Android smartphones & tablets (Android 9.0+)
          * **`papr-v${VERSION}-armeabi-v7a.apk`** — For legacy 32-bit Android phones
          * **`papr-v${VERSION}-universal.apk`** — Universal APK supporting all architectures
          * **`papr-v${VERSION}-x86_64.apk`** — For 64-bit Android Emulators & ChromeOS

          EOF

          if [ -n "$CUSTOM_NOTES" ]; then
            echo -e "\n### 🌟 Highlights\n${CUSTOM_NOTES}\n" >> release_body.md
          fi

          if [ -n "$COMMITS" ]; then
            echo -e "\n### 🛠️ Changes\n${COMMITS}\n" >> release_body.md
          fi

          echo -e "\n### 🔒 Integrity & Security\nVerify file checksums using \`sha256sum -c checksums.txt\`.\n" >> release_body.md

      - name: "Publish GitHub Release on Public Repository"
        uses: softprops/action-gh-release@v2
        with:
          name: "Papr v${{ inputs.version }}"
          tag_name: "v${{ inputs.version }}"
          target_commitish: "main"
          body_path: release_body.md
          draft: false
          prerelease: false
          files: |
            dist/release-apks/*.apk
            dist/release-apks/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
