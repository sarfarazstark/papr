name: "Papr Cloud Release Build"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version (e.g. 0.5.2 or 0.6.0)"
        required: true
        type: string
        default: "0.5.2"
      custom_notes:
        description: "Optional custom release highlights"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: "Build 5 Production APKs & Publish Release"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
      _JAVA_OPTIONS: "-Xmx6144m"

    steps:
      - name: "Configure SSH Agent for Private Repo Access"
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PAPR_CORE_SSH_KEY }}

      - name: "Checkout Private Source Repository (papr-core)"
        uses: actions/checkout@v4
        with:
          repository: "sarfarazstark/papr-core"
          ssh-key: ${{ secrets.PAPR_CORE_SSH_KEY }}
          fetch-depth: 0

      - name: "Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Setup Bun Toolchain"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: "Setup Java 17 (Temurin)"
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      - name: "Setup Android NDK & SDK"
        uses: android-actions/setup-android@v3

      - name: "Install Android NDK and CMake"
        timeout-minutes: 5
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: "Install Node Dependencies"
        run: bun install --frozen-lockfile

      - name: "Run Lint, TypeCheck & Unit Tests"
        run: |
          bun run check
          bun run typecheck
          bun test

      - name: "Synchronize Native Android Configuration via Expo Prebuild"
        run: |
          npx expo prebuild --platform android --no-install

      - name: "Setup Gradle Build Cache"
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: "Compile Android Production Release APKs"
        working-directory: android
        timeout-minutes: 12
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --build-cache --parallel -Dorg.gradle.jvmargs="-Xmx6144m -XX:MaxMetaspaceSize=1024m" -Pandroid.enableMinifyInReleaseBuilds=true -Pandroid.enableShrinkResourcesInReleaseBuilds=true

      - name: "Collect and Organize APK Artifacts"
        run: |
          mkdir -p dist/release-apks
          VERSION_TAG="v${{ inputs.version }}"
          
          # Copy all generated split APKs and rename nicely
          find android/app/build/outputs/apk/release -name "*.apk" | while read -r apk_file; do
            filename=$(basename "$apk_file")
            # Determine architecture from filename
            if [[ "$filename" == *"arm64-v8a"* ]]; then
              dest="dist/release-apks/papr-${VERSION_TAG}-arm64-v8a.apk"
            elif [[ "$filename" == *"armeabi-v7a"* ]]; then
              dest="dist/release-apks/papr-${VERSION_TAG}-armeabi-v7a.apk"
            elif [[ "$filename" == *"x86_64"* ]]; then
              dest="dist/release-apks/papr-${VERSION_TAG}-x86_64.apk"
            elif [[ "$filename" == *"x86"* ]]; then
              dest="dist/release-apks/papr-${VERSION_TAG}-x86.apk"
            elif [[ "$filename" == *"universal"* ]]; then
              dest="dist/release-apks/papr-${VERSION_TAG}-universal.apk"
            else
              dest="dist/release-apks/papr-${VERSION_TAG}-${filename}"
            fi
            cp "$apk_file" "$dest"
            echo "Organized: $dest ($(du -h "$dest" | cut -f1))"
          done

          # Generate SHA-256 Checksums
          cd dist/release-apks
          sha256sum *.apk > checksums.txt
          cat checksums.txt

      - name: "Generate Release Notes"
        id: release_notes
        run: |
          VERSION="${{ inputs.version }}"
          CUSTOM_NOTES="${{ inputs.custom_notes }}"
          
          # Generate structured notes from git commits
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)")
          else
            COMMITS=$(git log -n 25 --pretty=format:"* %s (%h)")
          fi

          cat << 'EOF' > release_body.md
          ## 📦 Papr v${VERSION} Release

          **Papr** is a 100% offline, privacy-first mobile PDF and document powerhouse.

          ### 📱 Download for your Architecture:
          - 🚀 **`papr-v${VERSION}-arm64-v8a.apk`** — Recommended for 99% of modern Android devices.
          - ⚡ **`papr-v${VERSION}-universal.apk`** — Works on all Android devices (larger size).
          - 📱 **`papr-v${VERSION}-armeabi-v7a.apk`** — Older 32-bit ARM phones.
          - 💻 **`papr-v${VERSION}-x86_64.apk`** — ChromeOS / Android Emulators.
          - 💻 **`papr-v${VERSION}-x86.apk`** — 32-bit x86 emulators.

          EOF

          if [ -n "$CUSTOM_NOTES" ]; then
            echo -e "\n### 🌟 Highlights\n${CUSTOM_NOTES}\n" >> release_body.md
          fi

          cat << 'EOF' >> release_body.md

          ### 🔒 Checksums (SHA-256)
          ```text
          EOF
          cat dist/release-apks/checksums.txt >> release_body.md
          echo "```" >> release_body.md

          cat release_body.md

      - name: "Publish GitHub Release on Public Repository"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version }}"
          name: "Papr v${{ inputs.version }}"
          body_path: release_body.md
          files: |
            dist/release-apks/*.apk
            dist/release-apks/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
